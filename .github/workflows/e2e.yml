name: e2e

on:
  pull_request:
  push:
    branches: [main]

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsx --test lib/dashboard-nav-label.test.ts lib/design/dashboard-colours.test.ts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          INSTITUTION_PREVIEW: '1'
          SCOPE_PREVIEW: '1'
